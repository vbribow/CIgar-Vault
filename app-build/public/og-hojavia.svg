<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hojavía — Knowledge carried forward</title>
  <desc id="desc">A Cultural Rhythm social card for Hojavía in deep tobacco green, clay, olive, and warm cream.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2926"/>
      <stop offset="0.58" stop-color="#173a37"/>
      <stop offset="1" stop-color="#273b2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="65%">
      <stop offset="0" stop-color="#b66a43" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b66a43" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 33.5h34M33.5 0v34" stroke="#f5f1e8" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>
  <path d="M792 526c132-37 229-121 285-257 32-76 78-123 133-141-3 123-46 226-129 308-74 72-172 111-289 112z" fill="#b66a43" opacity="0.94"/>
  <path d="M806 521c93-64 180-137 262-221 49-51 93-105 131-162M966 402c-9-45-7-89 4-131M1052 316c37 3 75-3 114-17" fill="none" stroke="#f5f1e8" stroke-width="20" stroke-linecap="round" opacity="0.88"/>
  <rect x="70" y="66" width="66" height="66" rx="15" fill="#102c29" stroke="#d9b874" stroke-width="2"/>
  <path d="M84 116c15-4 27-14 34-29 4-10 9-15 16-18 0 16-5 29-16 40-10 9-21 14-34 14z" fill="#b66a43"/>
  <path d="M86 116c12-8 23-18 33-28 6-7 12-14 16-21M104 101c-1-6-1-12 1-18M116 90c5 1 10 0 16-3" fill="none" stroke="#f5f1e8" stroke-width="3" stroke-linecap="round"/>
  <text x="158" y="94" fill="#d9b874" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="4">FROM LEAF TO LEGACY</text>
  <text x="158" y="123" fill="#c7d0c0" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.4">PREMIUM CIGAR KNOWLEDGE &amp; STEWARDSHIP</text>
  <text x="70" y="300" fill="#f5f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="106" letter-spacing="8">HOJAVÍA</text>
  <text x="76" y="346" fill="#d9b874" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="5">OH-HA-VEE-AH</text>
  <line x1="72" y1="397" x2="594" y2="397" stroke="#b66a43" stroke-width="3"/>
  <text x="72" y="459" fill="#f5f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="38">Knowledge carried forward.</text>
  <text x="74" y="505" fill="#c7d0c0" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="0.7">Learn with confidence. Document with purpose.</text>
  <text x="74" y="536" fill="#c7d0c0" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="0.7">Preserve the culture behind every cigar.</text>
  <text x="74" y="584" fill="#d9b874" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">KNOW WHAT YOU COLLECT.</text>
